_base_: '../_base_/dimensionamento_foliar.yml'
# Configuração do modelo PPMobileSeg para o dataset LSIDBeans.
# As configurações específicas de otimização e agendamento de aprendizagem
# estão sobrepostas a partir do arquivo base. A perda contém duas entradas:
# - CrossEntropyLoss para segmentação
# - MSELoss para regressão de área por-pixel

batch_size: 16  # ajuste conforme sua GPU
num_workers: 12  # ajuste conforme sua CPU
iters: 5000 # por volta de 100 epochs

train_dataset:
  transforms: #potencialmente ajustar
    - type: Resize
      target_size: [512, 512]
      keep_ratio: True
    - type: Padding
      target_size: [512, 512]
    - type: RandomHorizontalFlip
    - type: RandomVerticalFlip  # útil para folhas
    #- type: RandomDistort
    #  brightness_range: 0.25
    #  contrast_range: 0.25
    #  saturation_range: 0.25
    - type: Normalize

val_dataset:
  transforms:
    - type: Resize
      target_size: [512, 512]
      keep_ratio: True
    - type: Padding
      target_size: [512, 512]
    - type: Normalize

test_dataset:
  transforms:
    - type: Resize
      target_size: [512, 512]
      keep_ratio: True
    - type: Padding
      target_size: [512, 512]
    - type: Normalize

precision: fp16
amp_level: O1

optimizer:
  _inherited_: False
  type: AdamW
  #weight_decay: 0.001  # Reduzido para dataset pequeno
  custom_cfg:
  - name: pos_embed
    weight_decay_mult: 0.0
  - name: head
    lr_multi: 10.0
  - name: bn
    weight_decay_mult: 0.0

lr_scheduler:
  type: PolynomialDecay
  learning_rate: 0.0004
  end_lr: 0
  power: 1.0
  warmup_iters: 2000
  warmup_start_lr: 1.0e-6

loss:
  types:
    - type: CrossEntropyLoss

  coef: [1.0]  # [seg_coef]

model:
  type: PPMobileSegOnly
  num_classes: 3  # fundo + folha + quadrado
  #freeze_backbone: 2
  backbone:
    type: MobileSeg_Base
    #inj_type: AAM
    out_feat_chs: [64, 128, 192] 
    pretrained: https://bj.bcebos.com/paddleseg/dygraph/ade20k/pp_mobileseg/pretrain/model.pdparams
  upsample: intepolate

# Configurações de checkpoint e logging
checkpoint:
  save_dir: output/lsidbeans
  save_interval: 500
  keep_checkpoint_max: 10

log_config:
  name: pp_mobileseg_lsidbeans
  interval: 50

# Configurações de validação
val_dataset_config:
  val_interval: 200

